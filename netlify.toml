# ─────────────────────────────────────────────────────────────
# Netlify configuration
# این اپلیکیشن به سرور Next.js و API نیاز دارد. انتشار خام پوشهٔ .next
# بدون آداپتور باعث دیپلوی ظاهراً موفق اما خطای 404 در همهٔ مسیرها می‌شود.
# ─────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  # خروجی Next.js که آداپتور نتلیفای آن را پردازش می‌کند
  publish = ".next"

[build.environment]
  # Next.js 16 به Node ≥ 20 نیاز دارد؛ نسخه LTS پایدار
  NODE_VERSION = "22"
  # نصب تمیز و بی‌سروصدا در CI
  NPM_FLAGS = "--no-audit --no-fund"
  # محافظت در برابر خطاهای assets بین دو استقرار متوالی (opt-in رسمی نتلیفای)
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# وابسته به تشخیص خودکار یا فعال بودن Integration در داشبورد نباشد.
# آداپتور، تابع سرور، مسیرها و فایل‌های قابل انتشار را تولید می‌کند.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# اگر تابع و مسیرهای لازم تولید نشده باشند، از انتشار بیلد خراب جلوگیری کن.
# این افزونه باید پس از آداپتور Next.js اجرا شود.
[[plugins]]
  package = "./netlify/plugins/verify-next-runtime"

# ── هدرهای امنیتی و کش ─────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    # باندل‌ها هش یکتا دارند → کش یک‌ساله ایمن
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
